<!doctype html>
<html lang="en">
<head>

    <!--  Зависимости Bootstrap-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href = "@{/css/bootstrap.css}" rel="stylesheet">
    <script th:src="@{/js/jquery-3.7.0.min.js}"></script>
    <script th:src="@{/js/bootstrap.js}"></script>
    <title>Создание задачи</title>
</head>
<body>
<div class="container-fluid p-0">
    <div class="container">
        <form class="mt-3" th:action="@{/tasks/create}" method="post">
            <div class="mb-3">
                <label for="title" class="form-label"><b>Название</b></label>
                <input class="form-control" id="title" name="title" placeholder=""></input>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label"><b>Задача</b></label>
                <textarea class="form-control" id="description" name="description" rows="15" placeholder=""></textarea>
            </div>

            <div class="mb-2">
                <label for="priority" class="form-label"><b>Приоритет</b></label>
                <select name="priority.id" id="priority" class="form-control">
                    <option th:each="priority: ${priorities}" th:value="${priority.id}" th:text="${priority.name}"></option>
                </select>
            </div>

            <div class="mb-2">
                <label for="category" class="form-label"><b>Категрия</b></label>
                <select name="categoriesId" multiple id="category" class="form-control" required>
                    <option th:each="category: ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
            </div>

            <div class="mb-3 row">
                <div class="col-6"></div>
                <div class="col-6">
                    <div class="row">
                        <div class="col-6"><a class="btn btn-danger w-100" th:href="@{/tasks}">Отмена</a></div>
                        <div class="col-6"><button class="btn btn-primary w-100" type="submit">Сохранить</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
